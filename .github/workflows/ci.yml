name: backend-checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: traceguard
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: traceguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceguard -d traceguard_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:4.1
        env:
          RABBITMQ_DEFAULT_USER: traceguard
          RABBITMQ_DEFAULT_PASS: test_only
          RABBITMQ_DEFAULT_VHOST: traceguard
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://traceguard:test_only@localhost:5432/traceguard_test
      TEST_RABBITMQ_URL: amqp://traceguard:test_only@localhost:5672/traceguard
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: cp .env.example .env
      - run: docker compose config --quiet
