name: traceguard

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-traceguard}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-traceguard}
    RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-traceguard}:${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-traceguard}
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 120s

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-traceguard}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-traceguard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-traceguard}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=15)"]
      interval: 15s
      timeout: 16s
      retries: 3

  worker:
    <<: *app
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "traceguard", "--loglevel=INFO", "--hostname=worker@%h"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping --destination worker@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  validation-worker:
    profiles: ["validation"]
    build:
      context: .
      target: validation-worker
    command: ["celery", "-A", "app.workers.validation_celery_app:celery_app", "worker", "-Q", "traceguard.validation", "--concurrency=1", "--loglevel=INFO"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-traceguard}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-traceguard}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-traceguard}:${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-traceguard}
      VALIDATION_IMAGE: ${VALIDATION_IMAGE:-traceguard-validation:1}
      VALIDATION_TIMEOUT_SECONDS: ${VALIDATION_TIMEOUT_SECONDS:-10}
      VALIDATION_COMMAND_TIMEOUT_SECONDS: ${VALIDATION_COMMAND_TIMEOUT_SECONDS:-10}
      VALIDATION_MEMORY_MB: ${VALIDATION_MEMORY_MB:-256}
      VALIDATION_CPUS: ${VALIDATION_CPUS:-1.0}
      VALIDATION_PIDS: ${VALIDATION_PIDS:-32}
      VALIDATION_TMP_MB: ${VALIDATION_TMP_MB:-16}
      VALIDATION_OUTPUT_BYTES: ${VALIDATION_OUTPUT_BYTES:-32768}
      VALIDATION_RESULT_BYTES: ${VALIDATION_RESULT_BYTES:-32768}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:-0}"]
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
